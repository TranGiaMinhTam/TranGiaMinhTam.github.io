name: Verify portfolio release candidate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "portfolio-release-candidate"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install exact dependencies
        run: npm ci

      - name: Verify integrated security and delivery candidate
        run: npm run verify:security-delivery:candidate

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: './artifacts/portfolio/u06-security-delivery'

# Deployment is intentionally absent while the production response-header contract is unmet.
